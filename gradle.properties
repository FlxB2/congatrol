kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Compose Hot Reload
# hotRunDesktop needs a JetBrains Runtime (the only JVM with the enhanced class redefinition it relies
# on). Let the plugin download one instead of making every machine install it by hand.
compose.reload.jbr.autoProvisioningEnabled=true
